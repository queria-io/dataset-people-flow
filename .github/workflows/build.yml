name: Build

# 公開せずにパイプラインと dbt build だけを回す。配布物は全部で約 190MB あるので、
# 東京都と沖縄県だけ取って形を確かめる（マスタは全国分を取る）
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import main; main.download_people_flow()"
        env:
          PEOPLE_FLOW_PREFECTURES: "13,47"
      - run: uv run dbt build --profiles-dir ci
