name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  # 元のデータは 2021 年 12 月分で公開を終えている。定期実行はせず、手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: people_flow
    secrets: inherit
